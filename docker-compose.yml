name: spaceworth

services:
  backend:
    build:
      context: .
      dockerfile: deployment/house-price-space/Dockerfile
    container_name: spaceworth-backend
    ports:
      - "7860:7860"
    environment:
      - PORT=7860
      - GEMINI_MODEL=gemini-3.5-flash-lite
      - ALLOWED_ORIGINS=*
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: spaceworth-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
